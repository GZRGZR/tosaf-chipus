<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>הגדרות</title><style>body{font-family:Arial;max-width:800px;margin:40px auto;padding:20px}section{padding:18px;border:1px solid #ddd;border-radius:12px;margin:12px 0}label{display:block;margin:12px 0}input{padding:8px;width:90%}button{padding:9px;margin:5px}</style></head><body><h1>הגדרות – חיפוש שיחות ואתרים</h1>
<section><h2>פרטיות ואינדוקס</h2><label><input type="checkbox" id="ai"> אינדקס שיחות AI</label><label><input type="checkbox" id="web"> אינדקס אתרים</label><p>מצב גלישה בסתר אינו נכנס לאינדקס.</p></section>
<section><h2>Gemini</h2><label><input type="checkbox" id="gem"> אפשר חיפוש חכם</label><label>מפתח Gemini API:<br><input type="password" id="key"></label><p>Gemini מקבל רק את טקסט השאילתה, לא את האינדקס ולא את תוכן השיחות.</p></section>
<section><h2>ייבוא היסטוריות</h2><input type="file" id="files" multiple accept=".json,.jsonl"><select id="kind"><option value="auto">זיהוי אוטומטי</option><option value="chatgpt">ChatGPT</option><option value="claude">Claude</option><option value="gemini">Gemini</option><option value="aistudio">AI Studio</option></select><button id="import">ייבא</button><p id="status"></p></section>
<section><button id="export">ייצא אינדקס</button><button id="clear">מחק הכול</button></section><script src="options.js"></script></body></html>
