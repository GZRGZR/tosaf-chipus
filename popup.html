<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>דף נוכחי</title><style>body{font-family:Arial,sans-serif;width:370px;margin:0;padding:14px;background:#f7f7f8;color:#222}h2{margin:0 0 5px;font-size:18px}.url{font-size:11px;color:#777;word-break:break-all;margin-bottom:10px}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;margin:8px 0}label{display:block;font-size:12px;color:#555;margin-bottom:4px}input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:8px;border:1px solid #ccc;border-radius:8px}textarea{min-height:82px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.grid button{width:auto}.primary{font-weight:bold}.danger{color:#a00}.muted{font-size:11px;color:#777;line-height:1.4}.status{font-size:12px;min-height:18px;margin-top:7px}.disabled{opacity:.55}</style></head><body><h2>🌐 הדף הנוכחי</h2><div id="url" class="url"></div><button id="openSearchTop" class="primary" style="margin-bottom:8px">🔎 פתח מסך החיפוש</button><div class="box"><label>שם הדף בחיפוש</label><input id="name" maxlength="160" placeholder="למשל: אתר חדשות X"><label style="margin-top:8px">תיאור הדף לחיפוש</label><textarea id="desc" maxlength="500" placeholder="כ־30 מילים: מה האתר מציע, נושאים, מילות חיפוש ומילים נרדפות…"></textarea><div class="grid"><button id="save" class="primary">שמור</button><button id="ai">✨ צור עם AI</button></div><div class="muted">יצירת AI שולחת ל-Gemini את כתובת הדף, הכותרת ואת הטקסט העיקרי שהורכב מאזור התוכן של הדף. נשלח טקסט בלבד, לא HTML, ורק לאחר לחיצה.</div></div><div class="box"><button id="readLater">📌 לקרוא אח״כ — שמור וסגור</button><div class="grid"><button id="indexNow">הכנס לאינדקס עכשיו</button><button id="openSearch">🔎 פתח חיפוש</button></div><div class="grid"><button id="deleteHistory" class="danger">מחק כתובת זו מהיסטוריה</button><button id="close">סגור</button></div></div><div id="status" class="status"></div><script src="popup.js"></script></body></html>
