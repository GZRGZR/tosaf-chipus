<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>חיפוש</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f7f7f8;color:#222}header{padding:16px;background:#fff;border-bottom:1px solid #ddd}h2{margin:0 0 10px}.row{display:flex;gap:6px}input,button,select{font:inherit;padding:9px;border:1px solid #ccc;border-radius:8px}input{flex:1}button{cursor:pointer;background:#fff}.smart{margin-top:8px}.result{background:#fff;margin:8px;padding:12px;border-radius:10px;border:1px solid #ddd}.meta{font-size:12px;color:#777}.title{font-weight:bold;margin:5px 0}.snippet{white-space:pre-wrap;font-size:13px;max-height:110px;overflow:hidden}.bar{display:flex;gap:6px;padding:8px;position:sticky;top:0;background:#f7f7f8}.danger{color:#a00}.empty{padding:20px;text-align:center;color:#777}</style></head><body>
<header><h2>🔎 חיפוש שיחות ואתרים</h2><div class="row"><input id="q" placeholder="מה אתה מחפש?"><button id="go">חפש</button></div><label class="smart"><input type="checkbox" id="smart"> חיפוש חכם עם Gemini (שולח רק את השאילתה)</label></header>
<div class="bar"><select id="filter"><option value="">הכול</option><option>chatgpt</option><option>gemini</option><option>aistudio</option><option>claude</option><option>web</option></select><button id="settings">⚙️</button><button id="clear" class="danger">מחק אינדקס</button></div><main id="results"></main>
<script src="sidepanel.js"></script></body></html>
